<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Skyshot — Aim. Charge. Launch.</title>
<style>
:root{font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:#24334b}*{box-sizing:border-box}body{margin:0;background:#151e38;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:crosshair}#hud{position:fixed;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.pill{background:#fff9e8e8;border:3px solid #29334d;border-radius:18px;padding:9px 15px;box-shadow:4px 5px 0 #29334d;font-size:14px;font-weight:900;letter-spacing:.04em}#hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#29334d;color:#fff5d8;border-radius:30px;padding:10px 19px;font-size:14px;font-weight:800;text-align:center;white-space:nowrap;pointer-events:none;box-shadow:0 5px 0 #151e38}#result{display:none;position:fixed;right:22px;top:21%;transform:none;width:min(320px,calc(100vw - 30px));background:#fff9e8;border:4px solid #29334d;border-radius:26px;text-align:center;padding:22px;box-shadow:9px 11px 0 #29334d}#result h1{font-size:36px;margin:0 0 5px;line-height:1.05}#result p{font-size:18px;font-weight:800;margin:8px 0 20px}button{background:#ef6d73;border:3px solid #29334d;box-shadow:4px 5px 0 #29334d;border-radius:13px;color:#fff9e8;padding:12px 22px;font:900 17px inherit;cursor:pointer}button:active{transform:translate(3px,4px);box-shadow:1px 1px 0 #29334d}@media(max-width:600px){#hud{left:8px;right:8px;top:8px;gap:5px;flex-wrap:wrap;justify-content:center}.pill{font-size:10px;padding:6px 8px}#result{left:15px;top:12%}#hint{font-size:12px;bottom:13px;white-space:normal;width:max-content;max-width:92vw}}
.scoreboard{position:absolute;left:50%;top:0;transform:translateX(-50%);min-width:235px;padding:5px 24px 8px;text-align:center;border:4px solid #29334d;border-radius:23px;background:linear-gradient(140deg,#fff9e8,#ffda7b 65%,#ff9b80);box-shadow:0 6px 0 #29334d,0 0 28px #ffdd7f99;color:#29334d;overflow:visible}.score-label{display:block;font-size:12px;font-weight:1000;letter-spacing:.16em}.score-number{display:block;font-size:clamp(29px,4vw,52px);font-weight:1000;line-height:1.04;font-variant-numeric:tabular-nums;text-shadow:2px 2px 0 #fff9e8}.score-spark{position:absolute;right:-16px;top:-17px;font-size:28px;color:#fff3a9;text-shadow:0 2px 0 #29334d;animation:twinkle 1s ease-in-out infinite alternate}.scoreboard.pop{animation:score-pop .45s ease-out}.scoreboard.impact{animation:score-impact .9s ease-out;box-shadow:0 6px 0 #29334d,0 0 55px #fff1a0}.scoreboard.impact .score-spark{font-size:38px}@keyframes score-pop{0%{transform:translateX(-50%) scale(1)}35%{transform:translateX(-50%) scale(1.18) rotate(-3deg)}100%{transform:translateX(-50%) scale(1)}}@keyframes score-impact{0%{transform:translateX(-50%) scale(1)}25%{transform:translateX(-50%) scale(1.32) rotate(4deg)}55%{transform:translateX(-50%) scale(1.1) rotate(-2deg)}100%{transform:translateX(-50%) scale(1)}}@keyframes twinkle{to{transform:rotate(30deg) scale(1.4);opacity:.6}}@media(max-width:600px){#hud{justify-content:space-between!important;padding-top:67px}.scoreboard{top:0;min-width:196px;padding:3px 14px 5px}.score-label{font-size:10px}.score-number{font-size:32px}#result{top:18%}}
#bonus{position:fixed;left:50%;top:113px;z-index:2;transform:translate(-50%,20px) scale(.4);opacity:0;color:#fff9d3;-webkit-text-stroke:2px #29334d;text-shadow:4px 5px 0 #29334d,0 0 25px #ffca62;font-size:clamp(20px,3vw,38px);font-weight:1000;white-space:nowrap;pointer-events:none}#bonus.show{animation:bonus-fly 1.5s ease-out forwards}@keyframes bonus-fly{0%{opacity:0;transform:translate(-50%,30px) scale(.4) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,60px) scale(1.18) rotate(3deg)}65%{opacity:1;transform:translate(-50%,82px) scale(1)}100%{opacity:0;transform:translate(-50%,-22px) scale(1.35)}}
</style>
</head>
<body>
<canvas id="game" aria-label="Hold to charge and release to launch a plunger into a cartoon butt"></canvas>
<div id="hud"><div class="pill" id="distance">DISTANCE · 0 m</div><div class="scoreboard" id="points"><span class="score-label">✦ STYLE POINTS ✦</span><span class="score-number" id="points-number">0</span><span class="score-spark">✦</span></div><div class="pill" id="best">BEST · 0 m</div></div>
<div id="bonus" aria-live="polite"></div>
<div id="hint">Move to aim · hold to charge · release to fire</div>
<div id="result"><h1>LEGENDARY LANDING! ✨</h1><p id="score"></p><button id="again">LAUNCH AGAIN ↗</button></div>
<script>
(()=>{
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const distanceEl=document.querySelector('#distance'),pointsEl=document.querySelector('#points'),pointsNumber=document.querySelector('#points-number'),bonusEl=document.querySelector('#bonus'),bestEl=document.querySelector('#best'),hint=document.querySelector('#hint'),result=document.querySelector('#result'),scoreEl=document.querySelector('#score');
const C={ink:'#29334d',sky:'#8bd9ee',cream:'#fff9e8',pink:'#f59ca7',red:'#ee646f',gold:'#ffca62'};
const ZOOM=2.2, GRAVITY=780;
let w=0,h=0,ground=0,camera=0,cameraY=0,last=0,mode='ready',charge=0,charging=false,angle=Math.PI*.24,flight=0,landingX=0,plunger={x:0,y:0,vx:0,vy:0,rotation:0},particles=[],sparks=[],gas=[],gasAge=0,gasTick=0,trail=[],best=0,flash=0,shotPower=0,stylePoints=0,shownPoints=0,lastScoreTier=0;
try{best=Number(localStorage.getItem('butt-landing-best'))||0}catch(e){}bestEl.textContent=`BEST · ${best} m`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),spawn=()=>({x:110,y:ground-105});
function resize(){w=innerWidth/ZOOM;h=innerHeight/ZOOM;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);ctx.setTransform(d*ZOOM,0,0,d*ZOOM,0,0);ground=h*.79;if(mode==='ready'){Object.assign(plunger,spawn())}}
addEventListener('resize',resize);resize();
function ellipse(x,y,rx,ry,fill,stroke=C.ink,line=3){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=line;ctx.stroke()}}
function round(x,y,ww,hh,r,fill,stroke=C.ink,line=3){ctx.beginPath();ctx.roundRect(x,y,ww,hh,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.lineWidth=line;ctx.strokeStyle=stroke;ctx.stroke()}}
function line(x1,y1,x2,y2,color=C.ink,width=3){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke()}
function cloud(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,10,64,20,'#d6f5f2',null);ellipse(-31,0,23,19,C.cream,null);ellipse(0,-14,32,27,C.cream,null);ellipse(32,2,27,20,C.cream,null);ctx.restore()}
function scenery(t){const sky=ctx.createLinearGradient(0,-h,0,ground);sky.addColorStop(0,'#76c7ed');sky.addColorStop(1,'#c5f2df');ctx.fillStyle=sky;ctx.fillRect(0,-3000,w,3000+h);
ctx.fillStyle='#ffe29a';ctx.beginPath();ctx.arc(w*.82,Math.max(85,h*.18),49,0,7);ctx.fill();
for(let i=-1;i<25;i++){let x=i*290+70-camera*.18;while(x< -150)x+=Math.ceil((w+400)/7250)*7250;cloud(x,90+(i*79%110),.65+(i%3)*.14)}
ctx.fillStyle='#90d5bd';for(let i=-1;i<Math.ceil(w/240)+2;i++){const x=i*240-(camera*.36%240);ctx.beginPath();ctx.ellipse(x,ground+14,185,78,0,Math.PI,0);ctx.fill()}
ctx.fillStyle='#f7dca7';ctx.fillRect(0,ground,w,3000);line(0,ground,w,ground,'#3b615d',5);
for(let i=Math.floor(camera/180)-1;i<Math.ceil((camera+w)/180)+1;i++){const x=i*180-camera;line(x,ground+26,x+29,ground+26,'#c89e75',3);if(i>0){ctx.fillStyle='#9b806a';ctx.font='bold 12px Trebuchet MS';ctx.fillText(`${Math.round((i*180-110)/10)}m`,x+3,ground+48)}}
for(let i=Math.floor(camera/92)-1;i<Math.ceil((camera+w)/92)+1;i++){let x=i*92+25-camera;ellipse(x,ground-4,3,6,'#6aad83',null);ellipse(x+8,ground-3,3,5,'#6aad83',null)}
}
function launcher(){let x=110-camera;if(x< -170||x>w+80)return;round(x-57,ground-41,108,42,15,'#e5b977');ellipse(x-30,ground-4,14,14,C.ink,null);ellipse(x+30,ground-4,14,14,C.ink,null);ctx.save();ctx.translate(x,ground-103);ctx.rotate(-angle);round(-42,-12,78,24,12,'#d9e8d2');round(-55,-17,24,34,8,'#f4ce78');ctx.restore();ellipse(x-28,ground-57,11,11,C.gold);line(x-29,ground-48,x-37,ground-36,C.ink,4)}
function butt(x,wiggle=0){x-=camera;if(x< -150||x>w+150)return;ctx.save();ctx.translate(x,ground+wiggle);
const squash=mode==='landed'?1+flash*.17:1;ctx.scale(1+(squash-1)*.65,1/squash);
ellipse(0,-4,104,13,'#997d7090',null);
round(-79,-45,56,50,16,'#566d9a');round(23,-45,56,50,16,'#566d9a');
for(const side of [-1,1]){ctx.save();ctx.translate(side*49,-67);
const skin=ctx.createRadialGradient(-side*17,-30,3,side*5,12,83);skin.addColorStop(0,'#ffe8d4');skin.addColorStop(.45,'#ffc1b9');skin.addColorStop(.78,'#f59fae');skin.addColorStop(1,'#d87896');
ellipse(0,0,55,62,skin,C.ink,3.5);ellipse(-side*16,-30,23,11,'#fff0db99',null);
ctx.beginPath();ctx.moveTo(-side*27,46);ctx.quadraticCurveTo(0,62,side*31,42);ctx.strokeStyle='#c8738d';ctx.lineWidth=2.5;ctx.stroke();ctx.restore()}
ctx.beginPath();ctx.moveTo(0,-127);ctx.bezierCurveTo(-7,-101,-9,-66,0,-24);ctx.strokeStyle='#a55372';ctx.lineWidth=6;ctx.lineCap='round';ctx.stroke();ctx.beginPath();ctx.moveTo(5,-123);ctx.bezierCurveTo(9,-92,8,-55,3,-30);ctx.strokeStyle='#ffe0ce';ctx.lineWidth=2.5;ctx.stroke();
round(-76,-148,152,23,9,'#526d94');round(-76,-148,152,7,4,'#91acc8',null);round(-12,-144,24,16,5,C.gold);line(-61,-127,-52,-124,'#c2d5df',2);line(52,-124,61,-127,'#c2d5df',2);
ctx.fillStyle='#fff7cf';ctx.font='bold 17px Trebuchet MS';ctx.fillText('✦',57,-69);ctx.restore()}
function puffGas(count){for(let i=0;i<count;i++){const side=i%2?-1:1,a=(i*2.399)%6.28;gas.push({x:landingX+side*(25+i%5*8),y:ground-36-(i%3)*9,vx:side*(32+i%6*10)+Math.cos(a)*14,vy:-33-(i%7)*11,age:0,life:1.15+(i%5)*.21,r:8+(i%4)*5})}}
function drawGas(t){for(const p of gas){const k=p.age/p.life;ctx.save();ctx.globalAlpha=Math.sin(Math.PI*k)*.58;const x=p.x-camera,y=p.y;ellipse(x,y,p.r*(1+k*.75),p.r*(.75+k*.4),'#9dcf87',null);ellipse(x-p.r*.45,y-p.r*.28,p.r*.65,p.r*.55,'#cce9a3',null);ctx.restore()}
if(mode==='landed'&&gasAge<9){const x=landingX-camera;for(let i=-2;i<=2;i++){ctx.save();ctx.globalAlpha=(1-gasAge/10)*(.45+.15*Math.sin(t*4+i));ctx.beginPath();for(let j=0;j<=15;j++){let yy=ground-105-j*5,xx=x+i*29+Math.sin(j*.65+t*5+i)*5;if(j===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy)}ctx.strokeStyle='#6d9974';ctx.lineWidth=2.8;ctx.lineCap='round';ctx.stroke();ctx.restore()}}}
function projectile(x,y,r=0){ctx.save();ctx.translate(x-camera,y);ctx.rotate(r+(mode==='flight'?Math.sin(flight*22)*.11:0));const pulse=mode==='flight'?Math.sin(flight*28)*1.6:0;line(-13,0,27,0,'#785847',10);round(22,-8,15,16,5,C.gold);ellipse(-19,0,15+pulse,19-pulse*.3,C.red);ellipse(-28,0,7,17,'#ff9ba0');ellipse(-29,-7,3,5,'#ffe5dfaa',null);line(-2,-4,11,-4,'#ad8762',1.5);if(mode==='flight'){for(let i=0;i<3;i++){const a=flight*13+i*2.094;ellipse(-5+Math.cos(a)*33,Math.sin(a)*28,2.2,2.2,C.cream,null)}}ctx.restore()}
function burst(x,y){for(let i=0;i<42;i++){let a=i*2.399;let v=85+(i*41%240);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-125,life:1,size:3+(i%4)*2,color:[C.gold,C.red,C.cream,'#80d4c1'][i%4]})}}
function aim(e){let rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/ZOOM+camera-110,y=(e.clientY-rect.top)/ZOOM-(ground-105);if(x>8||y< -8)angle=clamp(Math.atan2(-y,Math.max(20,x)),.16,1.32)}
function fire(){if(mode!=='ready'||!charging)return;charging=false;mode='flight';flight=0;shotPower=clamp(charge,0,1);let speed=Math.max(840+shotPower*1680,Math.sqrt((w+240)*GRAVITY/Math.sin(2*angle))*1.08);let origin=spawn();Object.assign(plunger,{x:origin.x,y:origin.y,vx:Math.cos(angle)*speed,vy:-Math.sin(angle)*speed,rotation:-angle});const targetY=ground-101,g=GRAVITY;let t=(Math.sin(angle)*speed+Math.sqrt((Math.sin(angle)*speed)**2+2*g*(targetY-origin.y)))/g;landingX=origin.x+plunger.vx*t;hint.textContent='SUPERSONIC!';trail=[];sparks=[]}
canvas.addEventListener('pointerdown',e=>{if(mode!=='ready')return;e.preventDefault();canvas.setPointerCapture(e.pointerId);aim(e);charging=true;charge=0;hint.textContent='HOLD... BUILD POWER... RELEASE!'});
canvas.addEventListener('pointermove',e=>{if(mode==='ready')aim(e)});canvas.addEventListener('pointerup',e=>{e.preventDefault();fire()});canvas.addEventListener('pointercancel',()=>{charging=false;charge=0});
function reset(){mode='ready';charge=0;charging=false;camera=0;cameraY=0;landingX=0;trail=[];particles=[];sparks=[];gas=[];gasAge=0;gasTick=0;flash=0;stylePoints=0;shownPoints=0;lastScoreTier=0;pointsNumber.textContent='0';pointsEl.classList.remove('pop','impact');bonusEl.classList.remove('show');bonusEl.textContent='';angle=Math.PI*.24;Object.assign(plunger,spawn());distanceEl.textContent='DISTANCE · 0 m';hint.textContent='Move to aim · hold to charge · release to fire';result.style.display='none'}
document.querySelector('#again').addEventListener('click',reset);
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(mode==='landed')reset();else if(mode==='ready'&&!charging){charging=true;charge=0}}if(mode==='ready'){if(e.code==='ArrowUp')angle=clamp(angle+.05,.16,1.32);if(e.code==='ArrowDown')angle=clamp(angle-.05,.16,1.32)}});addEventListener('keyup',e=>{if(e.code==='Space')fire()});
function frame(ms){let dt=Math.min((ms-last)/1000||0,.033);last=ms;let t=ms/1000;
if(mode==='ready'&&charging)charge=clamp(charge+dt/1.5,0,1);
if(mode==='flight'){flight+=dt;const step=dt*.5;plunger.vy+=GRAVITY*step;plunger.x+=plunger.vx*step;plunger.y+=plunger.vy*step;plunger.rotation=Math.atan2(plunger.vy,plunger.vx);if(trail.length===0||plunger.x-trail[trail.length-1].x>20)trail.push({x:plunger.x,y:plunger.y});if(trail.length>55)trail.shift();for(let i=0;i<3;i++){const a=flight*23+i*2.094;sparks.push({x:plunger.x-20-Math.cos(a)*11,y:plunger.y+Math.sin(a)*14,vx:-35-Math.cos(a)*24,vy:Math.sin(a)*35,life:.45+i*.1,size:2+i})}if(sparks.length>140)sparks.splice(0,sparks.length-140);let desired=Math.max(0,plunger.x-w*.32);camera+=(desired-camera)*Math.min(1,dt*12);distanceEl.textContent=`DISTANCE · ${Math.max(0,Math.round((plunger.x-110)/10))} m`;stylePoints+=dt*(4800+shotPower*7200)+plunger.vx*step*13;
if(plunger.y>=ground-101&&plunger.vy>0){plunger.y=ground-101;plunger.x=landingX;mode='landed';flash=1;gasAge=0;gasTick=0;puffGas(18);const bonus=25000+Math.round(shotPower*15000);stylePoints+=bonus;bonusEl.textContent=`+${bonus.toLocaleString()} LANDING BONUS!`;bonusEl.classList.remove('show');void bonusEl.offsetWidth;bonusEl.classList.add('show');pointsEl.classList.remove('pop');pointsEl.classList.add('impact');burst(landingX,ground-99);const meters=Math.max(0,Math.round((landingX-110)/10));distanceEl.textContent=`DISTANCE · ${meters} m`;if(meters>best){best=meters;bestEl.textContent=`BEST · ${best} m`;try{localStorage.setItem('butt-landing-best',best)}catch(e){}}scoreEl.textContent=`${meters} m flown · ${Math.round(stylePoints).toLocaleString()} style points!`;hint.textContent='';setTimeout(()=>{if(mode==='landed')result.style.display='block'},1100)}}
shownPoints+=Math.min(stylePoints-shownPoints,Math.max(1,(stylePoints-shownPoints)*Math.min(1,dt*10)));pointsNumber.textContent=Math.round(shownPoints).toLocaleString();const tier=Math.floor(shownPoints/10000);if(mode==='flight'&&tier>lastScoreTier){lastScoreTier=tier;pointsEl.classList.remove('pop');void pointsEl.offsetWidth;pointsEl.classList.add('pop')}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=480*dt;p.life-=dt*.8}particles=particles.filter(p=>p.life>0);flash=Math.max(0,flash-dt*2);
for(const s of sparks){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt}sparks=sparks.filter(s=>s.life>0);
if(mode==='landed'){gasAge+=dt;gasTick+=dt;if(gasAge<5.5&&gasTick>.16){gasTick=0;puffGas(2)}}for(const p of gas){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*.45;p.r+=dt*3}gas=gas.filter(p=>p.age<p.life);
const desiredY=mode==='flight'?Math.min(0,plunger.y-h*.43):0;cameraY+=(desiredY-cameraY)*Math.min(1,dt*9);
ctx.save();ctx.translate(0,-cameraY);scenery(t);if(mode==='flight'){ctx.save();ctx.globalAlpha=.35;for(let i=0;i<18;i++){const span=w+180,x=((i*113-t*(380+i*19))%span+span)%span-90,y=plunger.y+(i*73%170)-85;line(x,y,x+35+i%5*16,y,'#fff9e8',i%4===0?2:1)}ctx.restore();const x=plunger.x-camera;ctx.save();ctx.globalAlpha=.45;line(x-108,plunger.y+3,x-30,plunger.y,'#fff9e8',4);line(x-70,plunger.y-11,x-22,plunger.y-9,'#fff9e8',2);ctx.restore()}launcher();if(mode!=='ready'){const reveal=mode==='landed'?1:clamp((w+120-(landingX-camera))/260,0,1);if(reveal>0){ctx.save();ctx.globalAlpha=reveal;if(mode==='landed')drawGas(t);butt(landingX,mode==='landed'?Math.sin(t*32)*flash*5:0);ctx.restore()}}
if(mode==='ready'){projectile(plunger.x,plunger.y,-angle);let x=110-camera,y=ground-105;ctx.setLineDash([7,8]);ctx.strokeStyle='#fff9e8';ctx.lineWidth=3;ctx.beginPath();let sp=840+charge*1680;for(let i=0;i<30;i++){let tm=i*.075;let px=x+Math.cos(angle)*sp*tm,py=y-Math.sin(angle)*sp*tm+GRAVITY*.5*tm*tm;if(py>ground-100)break;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.stroke();ctx.setLineDash([]);round(25,ground-92,170,14,7,'#fff9e8');round(28,ground-89,164*charge,8,4,charge>.85?C.red:C.gold,null);ctx.fillStyle=C.ink;ctx.font='900 13px Trebuchet MS';ctx.fillText('POWER',25,ground-102)}else{for(let i=0;i<trail.length;i++){let p=trail[i];ellipse(p.x-camera,p.y,2+i/trail.length*4,2+i/trail.length*4,'#fff9e888',null)}for(const s of sparks){ctx.save();ctx.globalAlpha=clamp(s.life*1.7,0,1);ellipse(s.x-camera,s.y,s.size,s.size,C.gold,null);ctx.restore()}projectile(plunger.x,plunger.y,mode==='landed'?-Math.PI/2:plunger.rotation)}
for(const p of particles){ctx.globalAlpha=p.life;ellipse(p.x-camera,p.y,p.size,p.size,p.color,null)}ctx.globalAlpha=1;
ctx.restore();if(flash){ctx.fillStyle=`rgba(255,249,232,${flash*.28})`;ctx.fillRect(0,0,w,h)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body></html>
